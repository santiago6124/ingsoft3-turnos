name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # le da estado al badge y deja el cache para los PRs siguientes

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:            # por job y no arriba de todo: sólo los jobs que publican escriben paquetes
      contents: read        # sin esto el checkout no puede leer el código
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v3

      # ---- TP5: tests, coverage y umbral, en el mismo job (y el mismo required check) ----
      - name: Construir la etapa de tests
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: test                # se detiene en la etapa de tests, no llega a final
          load: true                  # la deja en el Docker local para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage (falla si no llega al umbral)
        run: |
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci \
            --collect:"XPlat Code Coverage"

      - name: Reporte de coverage
        if: ${{ !cancelled() }}       # también cuando falló: es la corrida que más interesa mirar
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/*/coverage.cobertura.xml" -sourcedirs:backend \
            -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub" \
            "-classfilters:-Program*;-Turnos.Api.Migrations.*;-Turnos.Api.Data.*;-Turnos.Api.Models.*;-Turnos.Api.Options.*"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage y resultados
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults/tests.trx

      # ---- TP6: entregar. Estos dos pasos van ÚLTIMOS a propósito: no hay ningún `if` que diga
      # «si los tests pasaron». Si el docker run de arriba sale en rojo, el job muere ahí y nunca
      # se llega acá. La condición está en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # el token de esta corrida: vive lo que dura el job

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend          # ahí está el Dockerfile del TP2
          # Sólo un push a main publica. Un PR construye y verifica, pero no sube nada.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/santiago6124/ingsoft3-turnos-backend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}   # /health lo devuelve: prueba qué imagen corre
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:            # por job y no arriba de todo: sólo los jobs que publican escriben paquetes
      contents: read        # sin esto el checkout no puede leer el código
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v7

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v3

      # ---- TP5: tests, coverage y umbral, en el mismo job (y el mismo required check) ----
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage (falla si no llega al umbral)
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"              # sin el archivo, rojo: mejor que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% | \${t[m].covered} de \${t[m].total} |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % | cubiertas |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ---- TP6: entregar. Estos dos pasos van ÚLTIMOS a propósito: no hay ningún `if` que diga
      # «si los tests pasaron». Si el docker run de arriba sale en rojo, el job muere ahí y nunca
      # se llega acá. La condición está en el orden.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # el token de esta corrida: vive lo que dura el job

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          # Sólo un push a main publica. Un PR construye y verifica, pero no sube nada.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/santiago6124/ingsoft3-turnos-frontend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}   # queda en /version.txt de la imagen
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---- TP6: la promoción arranca donde termina la verificación ----
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin los dos jobs en verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; sólo main despliega
    environment: qa                            # trae los hooks de QA y deja registro en Deployments
    permissions: {}                            # TP9 (CodeQL): sólo curl a los hooks, no necesita el token
    steps:
      # TP7: Render ya no construye nada. El hook le dice QUÉ IMAGEN ejecutar: la que publicaron
      # los jobs de build de ESTA corrida, por su etiqueta sha-<commit> completa. (Antes iba
      # `&ref=<commit>` y Render reconstruía ese commit desde el repo: otra construcción, no la
      # imagen verificada.) --get --data-urlencode agrega `&imgURL=…` a la URL del hook, que ya
      # trae su `?key=`, y codifica los `:` y `/` de la imagen. La URL va última: es el único
      # argumento suelto del curl.
      - name: Desplegar en QA la IMAGEN de este commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
          IMG_API: ghcr.io/santiago6124/ingsoft3-turnos-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/santiago6124/ingsoft3-turnos-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" > /dev/null
          echo "Pedido a Render: ejecutar $IMG_API y $IMG_FRONT"

      # Reintenta porque el free tier tiene contrato: Render construye (1 a 5 min) y un servicio
      # dormido tarda hasta un minuto en despertar. Un curl seco daría falsos rojos.
      - name: Smoke test (espera a que QA conteste con ESTE commit)
        shell: bash
        env:
          URL_API: https://turnos-api-qa-ga8a.onrender.com
          URL_FRONT: https://turnos-front-qa-eo7o.onrender.com
        run: |
          for i in $(seq 1 30); do
            # --max-time en cada curl: un servicio despertando acepta la conexión y no contesta.
            # Sin tope, curl esperaría hasta que el job muera por el límite del runner.
            HEALTH=$(curl -fsS --max-time 10 "$URL_API/health" || true)
            if echo "$HEALTH" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/turnos" > /dev/null \
               && [ "$(curl -fsS --max-time 10 "$URL_FRONT/version.txt" || true)" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_FRONT/api/turnos" > /dev/null; then
              echo "✅ QA corre $GITHUB_SHA: api, base y front y el front construido con ese mismo commit, que llega a SU api)"; exit 0
            fi
            echo "vuelta $i: todavía no (api: $(echo "$HEALTH" | head -c 120) · front: $(curl -fsS --max-time 10 "$URL_FRONT/version.txt" 2>/dev/null | head -c 40))"
            sleep 20
          done
          echo "❌ QA no respondió con $GITHUB_SHA a tiempo"; exit 1

  # ---- TP7: las dos suites contra QA, que ya ejecuta la imagen de ESTA corrida ----
  # Integración: pedidos HTTP a la API de QA, con su Postgres de verdad. Sin navegador: tarda segundos.
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    permissions:
      contents: read        # TP9 (CodeQL): el checkout, y nada más
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (sin navegador)
        run: npm ci
        working-directory: ./frontend

      - name: Integración contra la API de QA
        env:
          API_BASE_URL: https://turnos-api-qa-ga8a.onrender.com     # la API, no el front
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      # El único !cancelled() de este tramo de la cadena, junto con el de e2e: publicar el
      # reporte también cuando falló, que es cuando más importa.
      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: frontend/playwright-report
          retention-days: 14

  # e2e: Chromium usando el front de QA como una persona. Sólo corre si la API está sana: si no,
  # no se gasta un navegador en confirmar lo que la integración ya dijo.
  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    permissions:
      contents: read        # TP9 (CodeQL): el checkout, y nada más
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: https://turnos-front-qa-eo7o.onrender.com
          API_BASE_URL: https://turnos-api-qa-ga8a.onrender.com     # para preparar datos y limpiar
        run: npx playwright test e2e/turnos.spec.js
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 14

  # ---- TP6: el gate humano ----
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                  # EL gate (TP7): sin las dos suites en verde contra
                                                # QA ni siquiera se pide aprobación. No repite el
                                                # `if` de la rama: lo hereda por la cadena.
    environment: production                     # ⏸ acá la corrida se PAUSA hasta que alguien aprueba;
                                                # y sólo un job aprobado puede leer los hooks de PROD
    permissions: {}                             # TP9 (CodeQL): sólo curl a los hooks, no necesita el token
    concurrency:                               # nunca dos deploys a PROD pisándose. (No ordena la
      group: deploy-prod                        # cola de aprobaciones: una corrida vieja aprobada
      cancel-in-progress: false                 # después de una nueva haría retroceder PROD.)
    steps:
      # La MISMA imagen que QA ejecutó y que las dos suites probaron: misma etiqueta sha-<commit>
      # de esta corrida. Entre la pausa y la aprobación main se puede mover; esto no cambia lo que
      # se despliega, porque la etiqueta sale de github.sha de ESTA corrida.
      # Render ya no construye nada. El hook le dice QUÉ IMAGEN ejecutar: la que publicaron
      # los jobs de build de ESTA corrida, por su etiqueta sha-<commit> completa. (Antes iba
      # `&ref=<commit>` y Render reconstruía ese commit desde el repo: otra construcción, no la
      # imagen verificada.) --get --data-urlencode agrega `&imgURL=…` a la URL del hook, que ya
      # trae su `?key=`, y codifica los `:` y `/` de la imagen. La URL va última: es el único
      # argumento suelto del curl.
      - name: Desplegar en PROD la IMAGEN de este commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
          IMG_API: ghcr.io/santiago6124/ingsoft3-turnos-backend:sha-${{ github.sha }}
          IMG_FRONT: ghcr.io/santiago6124/ingsoft3-turnos-frontend:sha-${{ github.sha }}
        run: |
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API" > /dev/null
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT" > /dev/null
          echo "Pedido a Render: ejecutar $IMG_API y $IMG_FRONT"

      - name: Smoke test PROD (espera a que conteste con ESTE commit)
        shell: bash
        env:
          URL_API: https://turnos-api-prod-rowo.onrender.com
          URL_FRONT: https://turnos-front-prod-49p5.onrender.com
        run: |
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS --max-time 10 "$URL_API/health" || true)
            if echo "$HEALTH" | grep -q "\"commit\":\"$GITHUB_SHA\"" \
               && curl -fsS --max-time 10 "$URL_API/api/turnos" > /dev/null \
               && [ "$(curl -fsS --max-time 10 "$URL_FRONT/version.txt" || true)" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_FRONT/api/turnos" > /dev/null; then
              echo "✅ PROD corre $GITHUB_SHA: api, base y front y el front construido con ese mismo commit, que llega a SU api)"; exit 0
            fi
            echo "vuelta $i: todavía no (api: $(echo "$HEALTH" | head -c 120) · front: $(curl -fsS --max-time 10 "$URL_FRONT/version.txt" 2>/dev/null | head -c 40))"
            sleep 20
          done
          echo "❌ PROD no respondió con $GITHUB_SHA a tiempo"; exit 1
