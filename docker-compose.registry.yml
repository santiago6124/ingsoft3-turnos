services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: turnos_db            # la BD que espera la connection string del backend
    volumes:
      - db_data:/var/lib/postgresql/data   # los datos SOBREVIVEN al contenedor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnos_db"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/santiago6124/turnos-backend:v0.1.1    # antes: build: ./backend
    environment:
      # Pisa ConnectionStrings:AppointmentsDb de appsettings.json. "db" es el nombre
      # del servicio en la red interna de compose, no localhost.
      ConnectionStrings__AppointmentsDb: "Host=db;Port=5432;Database=turnos_db;Username=postgres;Password=${DB_PASSWORD}"
    ports:
      - "8080:8080"                    # para curl/Swagger; el browser entra por el 3000
    depends_on:
      db:
        condition: service_healthy     # espera a que la BD esté LISTA, no solo iniciada

  frontend:
    image: ghcr.io/santiago6124/turnos-frontend:v0.1.1   # antes: build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
